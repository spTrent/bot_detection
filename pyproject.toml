[project]
name = "bot-detection"
version = "0.1.0"
description = "Детекция ботов-парсеров по событиям куки: признаки поведения и CatBoost под метрику Precision при Recall >= 0.7"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
score-cookies = "inference:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["features", "inference", "metric", "models"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 79
target-version = 'py314'
exclude = [
    '.venv/',
    '__pycache__',
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "Q"]
fixable = ['ALL']
ignore = ['E101', 'E501']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = "double"

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.14'
disallow_untyped_defs = true
strict_optional = true
exclude = [
    '.venv/',
    '__pycache__',
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = 'metric'
disallow_untyped_defs = false
